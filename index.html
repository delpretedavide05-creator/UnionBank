<script>
const CATS=['Giroconto','Ristoranti','Bar e caffè','Supermercato','Abbonamenti','Svago','Viaggi','Trasporti','Auto','Shopping','Casa','Salute','Cura persona','Sport','Istruzione','Contanti','Tasse e banca','Regali','Rimborsi','Entrate','Altro'];
const RULES=[[/ristorant|king dell|pizz|trattor|mcdonald|sushi|just ?eat|glovo|deliveroo|\bbar\b|caff/i,'Ristoranti'],[/conad|carrefour|lidl|eurospin|\bcoop\b|despar|esselunga|famila|todis/i,'Supermercato'],[/cinema|netflix|spotify|disney|steam|playstation|teatro/i,'Svago'],[/msc|ryanair|easyjet|booking|airbnb|trenitalia|italo|hotel|wizz/i,'Viaggi'],[/uber|taxi|benzina|\beni\b|q8|esso|telepass|\banm\b|unico|autostrad/i,'Trasporti'],[/apple\.com|icloud|google|prime|abbonament|youtube/i,'Abbonamenti'],[/amazon|zalando|ikea|shein|decathlon/i,'Shopping'],[/farmaci|medic|ospedale|clinic/i,'Salute']];
const OWN=/del prete davide|davide del prete|revolut\*\*|trade republic|buddy/i;
const MESI={gen:1,feb:2,mar:3,apr:4,mag:5,giu:6,lug:7,ago:8,set:9,ott:10,nov:11,dic:12};
let tx=[];try{tx=JSON.parse(localStorage.getItem('tx')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('tx',JSON.stringify(tx))}catch(e){}};
const num=s=>{s=String(s).replace(/[€\s"]/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');return parseFloat(s)};
const eur=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
function cat(t){const d=t.desc;if(OWN.test(d)||t.xfer)return'Giroconto';
 if(t.amount>0)return t.card?'Rimborsi':'Entrate';
 for(const[r,c]of RULES)if(r.test(d))return c;return'Altro'}
const pad=n=>String(n).padStart(2,'0');
function parseBuddy(txt){const out=[];const re=/(\d{2})\.(\d{2})\.(\d{2})\s+\d{2}\.\d{2}\.\d{2}\s+/g;const pos=[];let m;
 while((m=re.exec(txt)))pos.push({i:m.index,e:re.lastIndex,d:`20${m[3]}-${m[2]}-${m[1]}`});
 pos.forEach((p,k)=>{let ch=txt.slice(p.e,k+1<pos.length?pos[k+1].i:txt.length);
  ch=ch.split(/Per il blocco|Per tua tutela|UniCredit SpA|SALDO FINALE/)[0];
  const a=[...ch.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2})/g)];if(!a.length)return;const v=num(a[a.length-1][1]);
  if(!v||/COMPETENZE/.test(ch))return;const entr=/VERSAMENTO/i.test(ch);
  out.push({date:p.d,desc:ch.replace(/\s+/g,' ').replace(/\s*[\d.]+,\d{2}\s*$/,'').slice(0,110).trim(),amount:entr?v:-v,account:'Buddybank'})});return out}
function parseTR(txt){const out=[];const s=txt.split('TRANSAZIONI SUL CONTO')[1]||'';const sec=s.split('PANORAMICA DEL SALDO')[0];
 const ini=txt.match(/Conto corrente\s+([\d.]+,\d{2})/);let prev=ini?num(ini[1]):null;
 const re=/(\d{2}) (gen|feb|mar|apr|mag|giu|lug|ago|set|ott|nov|dic) (\d{4}) (.+?) ([\d.]+,\d{2}) € ([\d.]+,\d{2}) €/g;let m;
 while((m=re.exec(sec))){const bal=num(m[6]);let amt=prev===null?num(m[5]):Math.round((bal-prev)*100)/100;prev=bal;
  const card=/carta/i.test(m[4]);out.push({date:`${m[3]}-${pad(MESI[m[2]])}-${m[1]}`,desc:m[4].replace(/^Transazione con carta\s*/,'').trim(),amount:amt,account:'Trade Republic',card})}return out}
async function readPdf(file){const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const pages=[];
 for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();pages.push(c.items.map(x=>x.str).join(' ').replace(/\s+/g,' '))}return pages}
function csvRows(t){const d=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';const rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==d){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}
 r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows}
function parseCsv(t,account){const rows=csvRows(t);if(rows.length&&/^\s*\d{4}-\d{2}-\d{2}/.test(rows[0][0]))rows.unshift(['data','descrizione','importo','conto']);const h=rows[0].map(x=>x.toLowerCase().trim());
 const find=(...res)=>{for(const re of res){const i=h.findIndex(x=>re.test(x));if(i>=0)return i}return -1};
 const co=find(/^(conto|account)$/),di=find(/completed|data operazione|^data|date/,/started/),de=find(/descr|causale|merchant/),am=find(/^(importo|amount)/),ty=find(/^(type|tipo)/),dr=find(/dare|uscite|addebit/),av=find(/avere|entrate|accredit/);
 if(di<0||de<0||(am<0&&dr<0))throw new Error('Colonne non riconosciute nel CSV');
 return rows.slice(1).map(r=>{const m=r[di].match(/(\d{2})[\/.-](\d{2})[\/.-](\d{4})/)||null;let date;
  if(m)date=`${m[3]}-${m[2]}-${m[1]}`;else{const y=r[di].match(/(\d{4})-(\d{2})-(\d{2})/);if(!y)return null;date=y[0]}
  let a=am>=0?num(r[am]):(av>=0&&r[av]?num(r[av]):0)-(dr>=0&&r[dr]?Math.abs(num(r[dr])):0);if(isNaN(a))return null;
  const type=ty>=0?r[ty]:'';return{date,desc:(r[de]||type).trim().slice(0,110),amount:a,account:(co>=0&&r[co]&&r[co].trim())||account,xfer:/top-?up|transfer|exchange|giroconto/i.test(type)&&/davide|del prete|top-?up|exchange/i.test(r[de]+type)}}).filter(Boolean)}
document.getElementById('f').addEventListener('change',async e=>{const msg=document.getElementById('msg');let added=0,tot=0;
 try{for(const f of e.target.files){let rows;
  if(/\.pdf$/i.test(f.name)){const p=await readPdf(f),all=p.join(' ');
   rows=/trade republic/i.test(all)&&/TRANSAZIONI SUL CONTO/.test(all)?parseTR(all):(()=>{const r=parseBuddy(p.join(' '));return r.length?r:parseBuddyList(p)})(); if(!rows.length)throw new Error('Formato PDF non riconosciuto: '+f.name)}
  else{const a=document.getElementById('acc').value;if(!a)throw new Error('Scegli il conto prima di caricare un CSV');rows=parseCsv(await f.text(),a)}
  const keys=new Set(tx.map(t=>t.k));tot+=rows.length;
  const sc=!/\.pdf$/i.test(f.name)&&document.getElementById('acc').value=='Shortcuts';const cnt={};rows.forEach(r=>{r.k=[r.date,r.amount,r.account,r.desc].join('|').replace(/[^A-Za-z0-9|.,:*_-]/g,'');cnt[r.k]=(cnt[r.k]||0)+1;if(cnt[r.k]>1)r.k+='_'+cnt[r.k];if(sc)r.sc=1;const near=o=>o.account==r.account&&Math.abs(o.amount-r.amount)<0.005&&Math.abs(new Date(o.date)-new Date(r.date))<=5*864e5;if(sc){if(tx.some(o=>!o.sc&&near(o)))return}else{const i=tx.findIndex(o=>o.sc&&near(o));if(i>=0)tx.splice(i,1)}if(!keys.has(r.k)){keys.add(r.k);r.cat=cat(r);tx.push(r);added++}})}
  msg.textContent=`Importati ${added} movimenti nuovi (${tot-added} già presenti).`;save()}catch(err){msg.textContent='Errore: '+err.message}
 e.target.value='';render()});
document.getElementById('rst').onclick=()=>{if(confirm('Cancellare tutti i movimenti?')){tx=[];save();render()}};
document.getElementById('mon').onchange=render;
function bars(el,map,tot){const mx=Math.max(1,...Object.values(map));el.innerHTML=Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${k}</span><span><i style="width:${Math.max(2,v/mx*100)}%"></i></span><span>${eur(v)}</span></div>`).join('')||'<span class="mu">Nessun dato</span>'}
function render(){const ms=[...new Set(tx.map(t=>t.date.slice(0,7)))].sort().reverse();const sel=document.getElementById('mon');const cur=sel.value||'all';
 sel.innerHTML='<option value="all">Tutti i mesi</option>'+ms.map(m=>`<option value="${m}">${m}</option>`).join('');sel.value=ms.includes(cur)||cur=='all'?cur:'all';
 const L=tx.filter(t=>sel.value=='all'||t.date.startsWith(sel.value)).sort((a,b)=>b.date.localeCompare(a.date));
 const ex=t=>t.cat=='Giroconto';let inc=0,sp=0;const cm={},am={};
 L.forEach(t=>{if(ex(t))return;if(t.cat=='Entrate')inc+=t.amount;else{sp-=t.amount;cm[t.cat]=(cm[t.cat]||0)-t.amount;am[t.account]=(am[t.account]||0)-t.amount}});
 Object.keys(cm).forEach(k=>{if(cm[k]<=0&&k!='Rimborsi')delete cm[k]});
 const neg=Object.fromEntries(Object.entries(cm).filter(([k,v])=>v>0));
 document.getElementById('kp').innerHTML=`<div class="kpi"><small>Entrate</small><b class="pos">${eur(inc)}</b></div><div class="kpi"><small>Spese nette</small><b class="neg">${eur(sp)}</b></div><div class="kpi"><small>Saldo periodo</small><b>${eur(inc-sp)}</b></div><div class="kpi"><small>Movimenti</small><b>${L.length}</b></div>`;
 bars(document.getElementById('cat'),neg);bars(document.getElementById('acs'),Object.fromEntries(Object.entries(am).filter(([k,v])=>v>0)));
 document.getElementById('tb').innerHTML='<tr><th>Data</th><th>Conto</th><th>Descrizione</th><th>Importo</th><th>Categoria</th></tr>'+L.slice(0,300).map(t=>`<tr><td>${t.date}</td><td>${t.account}</td><td class="d">${t.desc.replace(/</g,'&lt;')}</td><td class="${t.amount<0?'neg':'pos'}">${eur(t.amount)}</td><td><select data-k="${t.k}">${CATS.map(c=>`<option${c==t.cat?' selected':''}>${c}</option>`).join('')}</select></td></tr>`).join('');
 document.querySelectorAll('#tb select').forEach(s=>s.onchange=()=>{const t=tx.find(x=>x.k==s.dataset.k);t.cat=s.value;save();render()})}
const MN=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];const nm=d=>{let m;if(/^incoming transfer/i.test(d))return'Bonifico in entrata';if(/^interest/i.test(d))return'Interessi';if(/revolut[*][*]/i.test(d))return'Ricarica Revolut';if(/VERSAMENTO SU SPORTELLO/i.test(d))return'Versamento contanti';if(/BONIFICO SEPA/i.test(d)){m=d.match(/PER: (.+?) COMM/);return'Bonifico'+(m?' · '+m[1]:'')}if(m=d.match(/DI EUR [0-9.,]+ (.+)$/))return m[1];return d.length>38?d.slice(0,38)+'…':d};
function render(){const sel=document.getElementById('mon'),ms=[...new Set(tx.map(t=>t.date.slice(0,7)))].sort().reverse(),cur=sel.value||ms[0]||'all';sel.innerHTML='<option value=all>Tutti</option>'+ms.map(m=>`<option value='${m}'>${m}</option>`).join('');sel.value=ms.includes(cur)||cur=='all'?cur:(ms[0]||'all');const v=sel.value;
document.getElementById('chips').innerHTML=['all',...ms].map(m=>`<button class='chip${m==v?' on':''}' data-m='${m}'>${m=='all'?'Tutti':MN[+m.slice(5)-1]+' '+m.slice(2,4)}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sel.value=b.dataset.m;render()});
const L=tx.filter(t=>v=='all'||t.date.startsWith(v)).sort((a,b)=>b.date.localeCompare(a.date));let inc=0,sp=0;const cm={},am={};L.forEach(t=>{if(t.cat=='Giroconto')return;if(t.cat=='Entrate')inc+=t.amount;else{sp-=t.amount;cm[t.cat]=(cm[t.cat]||0)-t.amount;am[t.account]=(am[t.account]||0)-t.amount}});
const lab=v=='all'?'Spese totali':'Spese di '+new Date(v+'-15').toLocaleDateString('it-IT',{month:'long',year:'numeric'});document.getElementById('hero').innerHTML=tx.length?`<div class='lab'>${lab}</div><div class='big'>${eur(sp)}</div><div class='sub'><span>Entrate <b>${eur(inc)}</b></span><span>Differenza <b>${eur(inc-sp)}</b></span></div>`:"<div class='lab'>Nessun movimento</div><div class='big'>0 €</div><div class='sub'>Tocca Importa per iniziare</div>";
